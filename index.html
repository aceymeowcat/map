<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Map</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .map-btn {
            position: absolute;
            right: 12px;
            z-index: 1000;
            padding: 10px 14px;
            font: 600 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #333;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            user-select: none;
        }

        #follow-btn  { top: 12px; }
        #layer-btn   { top: 56px; min-width: 80px; }

        #follow-btn.active {
            color: #fff;
            background: #2a7ae2;
            border-color: #2a7ae2;
        }

        .location-marker {
            width: 18px;
            height: 18px;
            background: #2a7ae2;
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(42, 122, 226, 0.4),
                        0 1px 4px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <button id="follow-btn" class="map-btn" type="button">Follow me</button>
    <button id="layer-btn" class="map-btn" type="button">Run</button>

    <script>
        const map = L.map('map', {
            center: [42.356, -71.075],
            zoom: 15,
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20,
        }).addTo(map);

        const activityLayerOpts = {
            minNativeZoom: 15,
            maxNativeZoom: 15,
            minZoom: 0,
            maxZoom: 20,
        };
        const activityLayers = {
            run: L.tileLayer('run/{z}/{x}/{y}.png', activityLayerOpts),
            ride: L.tileLayer('ride/{z}/{x}/{y}.png', activityLayerOpts),
        };
        const activityOrder = ['run', 'ride'];
        let activeActivity = 'run';
        activityLayers[activeActivity].addTo(map);

        const layerBtn = document.getElementById('layer-btn');

        function setActivity(name) {
            if (name === activeActivity) return;
            map.removeLayer(activityLayers[activeActivity]);
            activeActivity = name;
            activityLayers[activeActivity].addTo(map);
            layerBtn.textContent = name === 'run' ? 'Run' : 'Ride';
        }

        layerBtn.addEventListener('click', () => {
            const next = activityOrder[(activityOrder.indexOf(activeActivity) + 1) % activityOrder.length];
            setActivity(next);
        });

        const locationIcon = L.divIcon({
            className: '',
            html: '<div class="location-marker"></div>',
            iconSize: [18, 18],
            iconAnchor: [9, 9],
        });

        const followBtn = document.getElementById('follow-btn');
        let marker = null;
        let following = false;
        let hasCenteredOnce = false;

        function setFollowing(value) {
            following = value;
            followBtn.classList.toggle('active', following);
            followBtn.textContent = following ? 'Following' : 'Follow me';
            if (following && marker) {
                map.panTo(marker.getLatLng());
            }
        }

        followBtn.addEventListener('click', () => setFollowing(!following));

        // Stop following if the user manually drags the map.
        map.on('dragstart', () => {
            if (following) setFollowing(false);
        });

        function onLocation(position) {
            const { latitude, longitude } = position.coords;
            const latlng = [latitude, longitude];

            if (!marker) {
                marker = L.marker(latlng, { icon: locationIcon }).addTo(map);
            } else {
                marker.setLatLng(latlng);
            }

            if (!hasCenteredOnce) {
                map.setView(latlng, Math.max(map.getZoom(), 16));
                hasCenteredOnce = true;
                setFollowing(true);
            } else if (following) {
                map.panTo(latlng);
            }
        }

        function onLocationError(err) {
            console.warn('Geolocation error:', err.message);
        }

        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition(onLocation, onLocationError, {
                enableHighAccuracy: true,
                maximumAge: 1000,
                timeout: 10000,
            });
        } else {
            followBtn.disabled = true;
            followBtn.textContent = 'Location unavailable';
        }
    </script>
</body>
</html>
