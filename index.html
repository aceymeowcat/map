<!DOCTYPE html>
<html lang='en'>
<head>
    <link rel='icon' type='image/png' href='icon.png'>
    <title>Map</title>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js'></script>
    <script src='https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js'></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
        .maplibregl-user-location-dot {
            width: 32px;
            height: 32px;
            background-color: transparent;
            background-image: url('icon.png');
            background-size: contain;
            background-repeat: no-repeat;
            border-radius: 0;
        }
        .maplibregl-user-location-dot:before,
        .maplibregl-user-location-dot:after {
            display: none;
        }
    </style>
</head>
<body>
    <div id='map'></div>
    <script>
        const protocol = new pmtiles.Protocol();
        maplibregl.addProtocol('pmtiles', protocol.tile);

        const MA_URL = 'https://pub-8988f98552af4ca08b302621e0512314.r2.dev/ma.pmtiles';
        const ma = new pmtiles.PMTiles(MA_URL);

        const CO_URL = 'https://pub-8988f98552af4ca08b302621e0512314.r2.dev/co.pmtiles';
        const co = new pmtiles.PMTiles(CO_URL);

        protocol.add(ma);
        protocol.add(co);

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/positron',
            zoom: 4,
            center: [-99.1302, 40.0757],
        });

        const geolocate = new maplibregl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true },
            trackUserLocation: true,
            showUserHeading: true,
        });
        map.addControl(new maplibregl.NavigationControl(), 'top-right');
        map.addControl(geolocate, 'top-right');

        map.on('load', () => {
            map.addSource('ma_source', {
                type: 'raster',
                url: `pmtiles://${MA_URL}`,
                tileSize: 512,
                minzoom: 0,
                maxzoom: 15
            });
            map.addLayer({
                id: 'ma',
                type: 'raster',
                source: 'ma_source'
            });
            map.addSource('co_source', {
                type: 'raster',
                url: `pmtiles://${CO_URL}`,
                tileSize: 512,
                minzoom: 0,
                maxzoom: 15
            });
            map.addLayer({
                id: 'co',
                type: 'raster',
                source: 'co_source'
            });
            map.addSource('mass_boundary', {
                type: 'geojson',
                data: 'ma.geojson'
            });
            map.addLayer({
                id: 'mass_boundary',
                type: 'line',
                source: 'mass_boundary',
                paint: {
                    'line-color': '#000000',
                    'line-width': 2
                }
            });
            map.addSource('co_boundary', {
                type: 'geojson',
                data: 'co.geojson'
            });
            map.addLayer({
                id: 'co_boundary',
                type: 'line',
                source: 'co_boundary',
                paint: {
                    'line-color': '#000000',
                    'line-width': 2
                }
            });
            geolocate.trigger();
        });
    </script>
</body>
</html>
