<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Map</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.css">
    <script src="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.js"></script>
    <style>
        html, body { height: 100%; margin: 0; }
        #map { height: 100%; }

        .layer-btn {
            width: auto;
            padding: 0 12px;
            height: 29px;
            font: 600 13px/29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #333;
            background: #fff;
            border: 0;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        const activities = ['run', 'ride'];
        let active = activities[0];

        const map = new maplibregl.Map({
            container: 'map',
            center: [-71.1231, 42.3416],
            zoom: 15,
            style: {
                version: 8,
                sources: {
                    basemap: {
                        type: 'raster',
                        tiles: ['a', 'b', 'c', 'd'].map(s => `https://${s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png`),
                        tileSize: 256,
                        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                    },
                    run: { type: 'raster', tiles: ['run/{z}/{x}/{y}.png'], tileSize: 512, minzoom: 5, maxzoom: 15 },
                    ride: { type: 'raster', tiles: ['ride/{z}/{x}/{y}.png'], tileSize: 512, minzoom: 5, maxzoom: 15 },
                },
                layers: [
                    { id: 'basemap', type: 'raster', source: 'basemap' },
                    { id: 'run', type: 'raster', source: 'run' },
                    { id: 'ride', type: 'raster', source: 'ride', layout: { visibility: 'none' } },
                ],
            },
        });

        // Built-in geolocate button: tracks position, shows a location dot,
        // and auto-follows until the user drags the map.
        const geolocate = new maplibregl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true },
            trackUserLocation: true,
            showUserHeading: true,
        });
        map.addControl(geolocate);
        map.on('load', () => geolocate.trigger());

        class LayerToggle {
            onAdd() {
                this._container = document.createElement('div');
                this._container.className = 'maplibregl-ctrl maplibregl-ctrl-group';

                const btn = document.createElement('button');
                btn.className = 'layer-btn';
                btn.type = 'button';
                btn.textContent = 'Run';
                btn.onclick = () => {
                    map.setLayoutProperty(active, 'visibility', 'none');
                    active = activities[(activities.indexOf(active) + 1) % activities.length];
                    map.setLayoutProperty(active, 'visibility', 'visible');
                    btn.textContent = active === 'run' ? 'Run' : 'Ride';
                };

                this._container.appendChild(btn);
                return this._container;
            }
            onRemove() {
                this._container.remove();
            }
        }
        map.addControl(new LayerToggle());
    </script>
</body>
</html>
