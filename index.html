<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Map</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        #follow-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1000;
            padding: 10px 14px;
            font: 600 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #333;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            user-select: none;
        }

        #follow-btn.active {
            color: #fff;
            background: #2a7ae2;
            border-color: #2a7ae2;
        }

        .location-marker {
            position: relative;
            width: 60px;
            height: 60px;
        }

        .location-marker__cone {
            position: absolute;
            top: 0;
            left: 50%;
            width: 60px;
            height: 30px;
            margin-left: -30px;
            background: radial-gradient(ellipse at 50% 100%,
                rgba(42, 122, 226, 0.55) 0%,
                rgba(42, 122, 226, 0.25) 45%,
                rgba(42, 122, 226, 0) 75%);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            transform-origin: 50% 100%;
            transition: transform 120ms linear;
            opacity: 0;
            pointer-events: none;
        }

        .location-marker.has-heading .location-marker__cone {
            opacity: 1;
        }

        .location-marker__dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 18px;
            height: 18px;
            margin: -9px 0 0 -9px;
            background: #2a7ae2;
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(42, 122, 226, 0.4),
                        0 1px 4px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <button id="follow-btn" type="button">Follow me</button>

    <script>
        const map = L.map('map', {
            center: [42.356, -71.075],
            zoom: 15,
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20,
        }).addTo(map);

        L.tileLayer('run/{z}/{x}/{y}.png', {
            minNativeZoom: 15,
            maxNativeZoom: 15,
            minZoom: 0,
            maxZoom: 20,
        }).addTo(map);

        const locationIcon = L.divIcon({
            className: '',
            html: '<div class="location-marker">'
                + '<div class="location-marker__cone"></div>'
                + '<div class="location-marker__dot"></div>'
                + '</div>',
            iconSize: [60, 60],
            iconAnchor: [30, 30],
        });

        const followBtn = document.getElementById('follow-btn');
        let marker = null;
        let following = false;
        let hasCenteredOnce = false;
        let heading = null;
        let orientationRequested = false;

        function setFollowing(value) {
            following = value;
            followBtn.classList.toggle('active', following);
            followBtn.textContent = following ? 'Following' : 'Follow me';
            if (following && marker) {
                map.panTo(marker.getLatLng());
            }
        }

        function updateHeadingVisual() {
            if (!marker) return;
            const el = marker.getElement();
            if (!el) return;
            const root = el.querySelector('.location-marker');
            const cone = el.querySelector('.location-marker__cone');
            if (!root || !cone) return;
            if (heading == null || Number.isNaN(heading)) {
                root.classList.remove('has-heading');
                return;
            }
            root.classList.add('has-heading');
            cone.style.transform = `rotate(${heading}deg)`;
        }

        function onDeviceOrientation(event) {
            // iOS provides true compass heading on webkitCompassHeading (0 = N, clockwise).
            // Other browsers provide alpha (0 = device facing N, counter-clockwise).
            let h = null;
            if (typeof event.webkitCompassHeading === 'number') {
                h = event.webkitCompassHeading;
            } else if (event.absolute && typeof event.alpha === 'number') {
                h = 360 - event.alpha;
            } else if (typeof event.alpha === 'number') {
                h = 360 - event.alpha;
            }
            if (h != null) {
                heading = ((h % 360) + 360) % 360;
                updateHeadingVisual();
            }
        }

        function startOrientation() {
            window.addEventListener('deviceorientationabsolute', onDeviceOrientation, true);
            window.addEventListener('deviceorientation', onDeviceOrientation, true);
        }

        async function ensureOrientationPermission() {
            if (orientationRequested) return;
            orientationRequested = true;
            const Req = window.DeviceOrientationEvent;
            if (Req && typeof Req.requestPermission === 'function') {
                try {
                    const result = await Req.requestPermission();
                    if (result === 'granted') startOrientation();
                } catch (err) {
                    console.warn('Orientation permission error:', err);
                }
            } else {
                startOrientation();
            }
        }

        followBtn.addEventListener('click', () => {
            ensureOrientationPermission();
            setFollowing(!following);
        });

        // Stop following if the user manually drags the map.
        map.on('dragstart', () => {
            if (following) setFollowing(false);
        });

        function onLocation(position) {
            const { latitude, longitude } = position.coords;
            const latlng = [latitude, longitude];

            if (!marker) {
                marker = L.marker(latlng, { icon: locationIcon }).addTo(map);
                updateHeadingVisual();
            } else {
                marker.setLatLng(latlng);
            }

            if (!hasCenteredOnce) {
                map.setView(latlng, Math.max(map.getZoom(), 16));
                hasCenteredOnce = true;
                setFollowing(true);
            } else if (following) {
                map.panTo(latlng);
            }
        }

        function onLocationError(err) {
            console.warn('Geolocation error:', err.message);
        }

        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition(onLocation, onLocationError, {
                enableHighAccuracy: true,
                maximumAge: 1000,
                timeout: 10000,
            });
        } else {
            followBtn.disabled = true;
            followBtn.textContent = 'Location unavailable';
        }
    </script>
</body>
</html>
