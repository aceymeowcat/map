<!DOCTYPE html>
<html lang='en'>
<head>
    <link rel='icon' type='image/png' href='icon.png'>
    <title>Map</title>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js'></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
        .layer-btn {
            width: auto;
            padding: 0 12px;
            height: 29px;
            font: 600 13px/29px Arial, sans-serif;
            color: #333;
            background: #fff;
            border: 0;
            cursor: pointer;
        }
        .maplibregl-user-location-dot {
            width: 32px;
            height: 32px;
            background-color: transparent;
            background-image: url('icon.png');
            background-size: contain;
            background-repeat: no-repeat;
            border-radius: 0;
        }
        .maplibregl-user-location-dot:before,
        .maplibregl-user-location-dot:after {
            display: none;
        }
    </style>
</head>
<body>
    <div id='map'></div>
    <script>
        const activities = ['run', 'ride'];
        let active = activities[0];

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/positron',
            zoom: 15,
            center: [-71.1231, 42.3416],
        });

        const geolocate = new maplibregl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true },
            trackUserLocation: true,
            showUserHeading: true,
        });
        map.addControl(new maplibregl.NavigationControl(), 'top-right');
        map.addControl(geolocate, 'top-right');

        map.on('load', () => {
            map.addControl(new LayerToggle(), 'top-right');
            map.addSource('run', {
                type: 'raster',
                tiles: ['run/{z}/{x}/{y}.png'],
                tileSize: 512,
                minzoom: 5,
                maxzoom: 15
            });
            map.addLayer({
                id: 'run',
                type: 'raster',
                source: 'run'
            });
            map.addSource('ride', {
                type: 'raster',
                tiles: ['ride/{z}/{x}/{y}.png'],
                tileSize: 512,
                minzoom: 5,
                maxzoom: 15
            });
            map.addLayer({
                id: 'ride',
                type: 'raster',
                source: 'ride',
                layout: {
                    visibility: 'none'
                }
            });
            geolocate.trigger();
        });

        class LayerToggle {
            onAdd() {
                this._container = document.createElement('div');
                this._container.className = 'maplibregl-ctrl maplibregl-ctrl-group';

                const btn = document.createElement('button');
                btn.className = 'layer-btn';
                btn.type = 'button';
                btn.textContent = 'Run';
                btn.onclick = () => {
                    map.setLayoutProperty(active, 'visibility', 'none');
                    active = activities[(activities.indexOf(active) + 1) % activities.length];
                    map.setLayoutProperty(active, 'visibility', 'visible');
                    btn.textContent = active === 'run' ? 'Run' : 'Ride';
                };

                this._container.appendChild(btn);
                return this._container;
            }

            onRemove() {
                this._container.remove();
            }
        }
    </script>
</body>
</html>
